<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一号路线 · 离线碰撞检查</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#dce7ee;font:14px system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none}.panel{position:absolute;top:18px;left:18px;width:350px;background:#172530ee;border:1px solid #456074;border-radius:12px;padding:18px;box-shadow:0 12px 35px #0005}h1{font-size:19px;margin:0 0 10px}.note{font-size:12px;color:#b4c8d5;line-height:1.6}label{display:block;margin-top:13px}input[type=range],input[type=text]{width:100%}input[type=text]{background:#0e1b25;color:#edf7ff;border:1px solid #456074;border-radius:5px;padding:8px}button{margin:10px 6px 0 0;background:#29465b;border:1px solid #52748a;color:#fff;padding:7px 10px;border-radius:5px;cursor:pointer}.checks{display:flex;gap:15px}.checks label{margin-top:10px}.status{position:absolute;bottom:18px;left:18px;background:#172530df;padding:10px 14px;border-radius:7px;color:#b4c8d5;font-size:12px}#count{color:#82d3f8}.warn{color:#f8cf87}
</style>
<canvas id="view"></canvas>
<div class="panel"><h1>一号路线 · 碰撞与连通</h1><div class="note" id="note"></div><div class="checks"><label><input id="collision" type="checkbox" checked>碰撞</label><label><input id="nav" type="checkbox" checked>导航</label><label><input id="gap" type="checkbox" checked>候选缺口</label></div><label>只看此高度以下：<span id="heightLabel"></span><input id="height" type="range" min="-45" max="-12" value="-24" step=".2"></label><label>碰撞资产过滤<input id="filter" type="text" placeholder="例如 stair、floor、wall、door"></label><button id="top">俯视</button><button id="orbit">斜视</button><button id="reset">复位</button><p class="note">拖动旋转 · 滚轮缩放<br><span id="count"></span></p><div class="note warn">这是从游戏数据还原的局部检查视图；未解码或未确认的状态仍需单独审核。</div></div>
<div class="status" id="status">正在准备本地数据…</div>
<script>
const meta=__META__;
const encoded='__VERTICES__';
const canvas=document.querySelector('#view'),gl=canvas.getContext('webgl',{antialias:true});
if(!gl)throw Error('浏览器无法创建 WebGL');
document.querySelector('#note').textContent=meta.note;
const raw=atob(encoded),buffer=new ArrayBuffer(raw.length),bytes=new Uint8Array(buffer);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const values=new Float32Array(buffer);
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec3 p;attribute vec3 c;uniform mat4 m;varying vec3 color;varying float h;void main(){gl_Position=m*vec4(p,1.0);color=c;h=p.z;}'));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision mediump float;varying vec3 color;varying float h;uniform float ceiling;void main(){if(h>ceiling)discard;gl_FragColor=vec4(color,1.0);}'));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const vbo=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vbo);gl.bufferData(gl.ARRAY_BUFFER,values,gl.STATIC_DRAW);for(const [name,offset]of [['p',0],['c',12]]){const a=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,24,offset);}
const matrix=gl.getUniformLocation(program,'m'),ceiling=gl.getUniformLocation(program,'ceiling');let yaw=.5,pitch=.8,span=44,drag;
const height=document.querySelector('#height'),filter=document.querySelector('#filter');
function draw(){const ratio=devicePixelRatio||1,w=Math.round(innerWidth*ratio),h=Math.round(innerHeight*ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.enable(gl.DEPTH_TEST);gl.clearColor(.055,.083,.11,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const c=Math.cos(yaw),s=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),sx=span*w/h/2,sy=span/2,focus=-28;gl.uniformMatrix4fv(matrix,false,new Float32Array([c/sx,s*sp/sy,s*cp/200,0,-s/sx,c*sp/sy,c*cp/200,0,0,cp/sy,-sp/200,0,0,-focus*cp/sy,focus*sp/200,1]));gl.uniform1f(ceiling,Number(height.value));const text=filter.value.toLowerCase();let count=0;if(document.querySelector('#collision').checked){if(!text){gl.drawArrays(gl.TRIANGLES,0,meta.collisionCount);count=meta.ranges.length;}else for(const row of meta.ranges)if(row.label.toLowerCase().includes(text)){gl.drawArrays(gl.TRIANGLES,row.start,row.count);count++;}}if(document.querySelector('#nav').checked)gl.drawArrays(gl.TRIANGLES,meta.navStart,meta.navCount);if(document.querySelector('#gap').checked){gl.disable(gl.DEPTH_TEST);gl.drawArrays(gl.LINES,meta.gapStart,meta.gapCount);}document.querySelector('#heightLabel').textContent=Number(height.value).toFixed(1)+' m';document.querySelector('#count').textContent=count+' 个碰撞对象 · '+Math.round(meta.vertices/3).toLocaleString()+' 个显示三角形';document.querySelector('#status').textContent='离线本地数据 · UE世界中心 '+meta.centerUE.slice(0,2).join(', ')+' cm · 未启动游戏';}
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.006;pitch=Math.max(.12,Math.min(Math.PI/2,(pitch+(e.clientY-drag[1])*.006)));drag=[e.clientX,e.clientY];draw()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();span=Math.max(5,Math.min(120,span*Math.exp(e.deltaY*.001)));draw()},{passive:false});for(const id of ['height','filter','collision','nav','gap'])document.querySelector('#'+id).addEventListener('input',draw);document.querySelector('#top').onclick=()=>{pitch=Math.PI/2;draw()};document.querySelector('#orbit').onclick=()=>{pitch=.8;draw()};document.querySelector('#reset').onclick=()=>{yaw=.5;pitch=.8;span=44;height.value=-24;filter.value='';draw()};addEventListener('resize',draw);draw();
</script>
