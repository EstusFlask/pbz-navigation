name: Navigation bug · 导航问题
description: Missing or incorrect routes, integration and performance / 缺路、错路、联动与性能
title: "[Bug] "
body:
  - type: input
    id: versions
    attributes:
      label: Versions / 版本
      description: Navigation, Release or local Development, tracker and loaders.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / 复现步骤
      description: Area, target, start/end floors, mechanism state, and steps.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior / 预期与实际表现
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots / 相关日志或截图
      description: Redact personal information and keys. Do not upload complete saves or game/mod packages.
